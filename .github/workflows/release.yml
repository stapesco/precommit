name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual run

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11.x. npm trusted publishing needs npm >= 11.5.1
          # and Node >= 22.14.0, and Node 22 only ships npm 10.x.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # Node 24 already ships npm 11.19.1, which is above the npm 11.5.1 floor
      # for trusted publishing. Pin the major so a future npm 12 (which needs
      # Node >= 24.15.0) cannot silently change the publish path.
      - run: npm install -g npm@11
      - run: npm run build
      - run: npm test
      # Auth: npm trusted publishing (OIDC) is the primary path — the job holds
      # `id-token: write`, so npm exchanges a short-lived OIDC token for a
      # publish token and no long-lived secret is needed. NODE_AUTH_TOKEN below
      # is a fallback for when trusted publishing is not configured on the npm
      # side; the secret may be absent.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/**/*.js
            dist/**/*.d.ts
            LICENSE
            README.md
